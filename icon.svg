    <line x1="468" y1="502" x2="450" y2="402"/>
    <line x1="556" y1="502" x2="574" y2="402"/>
  </g>

  <!-- 眼睛 -->
  <circle cx="450" cy="386" r="42" fill="#FFFFFF"/>
  <circle cx="574" cy="386" r="42" fill="#FFFFFF"/>
  <circle cx="450" cy="386" r="16" fill="#2B2B2B"/>
  <circle cx="574" cy="386" r="16" fill="#2B2B2B"/>

  <!-- 嘴 -->
  <path d="M 551.5,655.7 A 42,36 0 0,1 472.5,655.7" fill="none" stroke="#2B2B2B" stroke-width="9" stroke-linecap="round"/>
