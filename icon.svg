<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="512" height="512">
  <!-- 橙色圆角背景 -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" ry="230" fill="#F2541B"/>

  <!-- 腿 -->
  <g stroke="#FFFFFF" stroke-width="22" stroke-linecap="round">
    <line x1="330" y1="690" x2="232" y2="768"/>
    <line x1="352" y1="714" x2="248" y2="822"/>
    <line x1="380" y1="730" x2="288" y2="866"/>
    <line x1="694" y1="690" x2="792" y2="768"/>
    <line x1="672" y1="714" x2="776" y2="822"/>
    <line x1="644" y1="730" x2="736" y2="866"/>
  </g>

  <!-- 钳臂 -->
  <g stroke="#FFFFFF" stroke-width="50" stroke-linecap="round">
